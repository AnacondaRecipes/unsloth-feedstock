# unsloth is pure Python (nothing compiles CUDA), but it targets NVIDIA GPUs. The cuda
# variant exists only so its build/test gets routed to a GPU worker pool; no nvcc output
# or CUDA lib ends up in the package. Hence cuda_compiler_version is arbitrary and
# unversioned -- 12.8 vs 13.0 would be byte-identical -- and there's a single `cuda`
# entry rather than one per CUDA version. The `none`/CPU variant is kept so unsloth stays
# installable on a GPU-less machine. linux-64 only (see build/skip in meta.yaml).
gpu_variant:
  - none
  - cuda                        # [linux and x86_64]

cuda_compiler_version:          # [linux and x86_64]
  - none                        # [linux and x86_64]
  - 13.0                        # [linux and x86_64]

zip_keys:                       # [linux and x86_64]
  -                             # [linux and x86_64]
    - gpu_variant               # [linux and x86_64]
    - cuda_compiler_version     # [linux and x86_64]
