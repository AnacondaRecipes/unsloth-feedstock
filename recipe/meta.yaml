{% set name = "unsloth" %}
{% set version = "2026.6.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/unsloth-{{ version }}.tar.gz
  sha256: 3d944b58d566ee8f6cd07841aa66d52d6046aab091ca546ecdfd24c7efc4a051

build:
  number: 0
  # linux-64 only: triton / xformers / unsloth_zoo (hard runtime deps) are linux-64-only on
  # pkgs/main. py>=3.10: unsloth_zoo / cut_cross_entropy require python >=3.10.
  skip: true  # [not linux64 or py<310]
  script:
    # Relax upstream upper caps that pkgs/main exceeds (pytorch 2.12, trl 1.4.0, datasets 4.8.2)
    # so the built wheel metadata matches the recipe run deps and `pip check` passes.
    - sed -i.bak 's/torch>=2.4.0,<2.11.0/torch>=2.4.0/' pyproject.toml
    - sed -i 's/trl>=0.18.2,!=0.19.0,<=0.24.0/trl>=0.18.2/' pyproject.toml
    - sed -i 's/datasets>=3.4.1,!=4.0\.\*,!=4.1.0,<4.4.0/datasets>=3.4.1/' pyproject.toml
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
    - wheel
  run:
    - python
    # direct
    - typer
    - pydantic
    - pyyaml
    - nest-asyncio
    # torch / xformers
    - pytorch >=2.4.0
    - xformers >=0.0.27.post2
    - bitsandbytes >=0.45.5,!=0.46.0,!=0.48.0
    # triton
    - triton >=3.0.0
    # huggingface
    - wheel >=0.42.0
    - packaging
    - numpy
    - tqdm
    - psutil
    - tyro
    - protobuf
    - sentencepiece >=0.2.0
    # upper caps relaxed (sed above); pkgs/main carries newer trl/datasets
    - datasets >=3.4.1
    - accelerate >=0.34.1
    - peft >=0.18.0,!=0.11.0
    - huggingface_hub >=0.34.0
    - hf-transfer
    - diffusers
    - transformers >=4.51.3,<=5.5.0
    - trl >=0.18.2
    - sentence-transformers
    - unsloth_zoo >=2026.6.6
    - torchvision

test:
  # No import test: importing unsloth requires a GPU runtime and patches torch/transformers
  # (mirrors conda-forge, which disabled the import test for the same reason).
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/unslothai/unsloth
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: 2-5X faster LLM finetuning
  description: |
    Unsloth makes finetuning of large language models like Llama, Mistral, Gemma
    and Qwen 2-5x faster while using up to 80% less memory, with no accuracy
    degradation, via custom Triton kernels, manual autograd, and optimized
    attention / RoPE / cross-entropy implementations.
  doc_url: https://docs.unsloth.ai
  dev_url: https://github.com/unslothai/unsloth

extra:
  skip-lints:
    # pytorch/triton/xformers are CBC-pinned runtime-only deps (pure-Python; not linked at build)
    - cbc_dep_in_run_missing_from_host
    # No import test: importing unsloth requires a GPU runtime + unsloth_zoo patching.
    - missing_imports_or_run_test_py
  recipe-maintainers:
    - isuruf
    - timkpaine
