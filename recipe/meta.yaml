{% set name = "unsloth" %}
{% set version = "2026.10.6" %}
# PyPI ships 2026.10.6 as a wheel only (no sdist), so the source is the GitHub tree.
# Upstream tags the repo per desktop release (v0.1.908-beta), not per PyPI version; this
# commit is that tag's target and carries unsloth/_version.py == "2026.10.6".
{% set commit = "5e55110278872d71a0f97fb951fedd1305d926fb" %}
{% set build_number = 0 %}
{% set cuda_enabled = (gpu_variant or "none") == "cuda" %}
{% set build = build_number + 100 if cuda_enabled else build_number %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/unslothai/{{ name }}/archive/{{ commit }}.tar.gz
  sha256: fb3ac1d7f7d24534333e9ba8f967808bc97733d9c29a7ed392976e918eee96f8

build:
  # CUDA variants offset +100 so conda prefers them where __cuda is present; the CPU
  # build stays installable on GPU-less machines.
  number: {{ build }}
  # linux-64 only: hard deps triton/xformers/unsloth_zoo are linux-64-only on pkgs/main.
  # py 3.10-3.14: upstream requires-python is >=3.9,<3.15; unsloth_zoo/cut_cross_entropy
  # on pkgs/main need >=3.10.
  skip: true  # [not linux64 or py<310 or py>314]
  # The cpu_/cuda_ prefix MUST stay or the two variants dedupe into one package. Keep
  # py{{ CONDA_PY }} too: a manual string drops conda-build's default py-prefix, and the
  # package is python-specific (cpXY .pyc). No CUDA version -- nothing links a toolkit.
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}    # [gpu_variant != "cuda"]
  string: cuda_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}   # [gpu_variant == "cuda"]
  # Nothing is compiled, so drop the C/C++ run_exports (libgcc-ng/libstdcxx-ng); else
  # they'd land on the cuda variant only, diverging its run deps from the CPU variant's.
  ignore_run_exports_from:                  # [gpu_variant == "cuda"]
    - {{ compiler('c') }}                   # [gpu_variant == "cuda"]
    - {{ compiler('cxx') }}                 # [gpu_variant == "cuda"]
  entry_points:
    - unsloth = unsloth_cli:app
  # The tree also holds the Unsloth Studio desktop app (studio/). Its backend installs as
  # part of the upstream wheel layout and is kept; its Vite/npm frontend bundle
  # (studio/frontend/dist) is not in git and cannot be built offline, so the Studio UI is
  # not shipped -- only the library and the `unsloth` CLI are.
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    # Nothing is compiled -- unsloth is pure Python. cuda-nvcc is here only to route the
    # PBP build/test tasks to the GPU worker pool, which is what makes __cuda resolvable
    # and lets the import test run on the cuda variant. compiler('c')/compiler('cxx')
    # are required because cuda-nvcc's activation script hard-fails without them.
    - {{ compiler('c') }}                   # [gpu_variant == "cuda"] analint: should_use_stdlib  # nothing is compiled; no sysroot/glibc pin wanted
    - {{ compiler('cxx') }}                 # [gpu_variant == "cuda"] analint: should_use_stdlib  # nothing is compiled; no sysroot/glibc pin wanted
    - {{ compiler('cuda') }}                # [gpu_variant == "cuda"] analint: should_use_stdlib  # GPU-pool routing only; no toolkit is linked
  host:
    - python
    - pip
    # pyproject.toml [build-system].requires pins both exactly.
    - setuptools 84.0.0
    - setuptools-scm 9.2.2
    # No cuda-version / cuda-cudart-dev on purpose: nothing links cudart, so there's no
    # toolkit to pin. Which CUDA line installs is decided by pytorch/xformers/triton/
    # bitsandbytes, each of which pins cuda-version itself.
  run:
    - python
    - __cuda                                # [gpu_variant == "cuda"]
    # pyproject.toml [project.dependencies] -- the CLI stack.
    - typer >=0.19.0
    - rich
    - pydantic
    - pyyaml
    - nest-asyncio
    - huggingface_hub >=0.34.0
    - structlog >=24.1.0
    - click >=8.0
    # Finetuning stack. Upstream moved it from [project.dependencies] into the
    # `huggingface` extra, but `import unsloth` cannot work without it and the published
    # PyPI wheel still declares it as hard Requires-Dist; bounds below are the wheel's,
    # except diffusers which takes the extra's py>=3.10 floor.
    - unsloth_zoo >=2026.10.6
    - wheel >=0.42.0
    - packaging
    # The *cuda* build glob only stops the CUDA build pairing with a cpu_mkl / cpu_openblas
    # pytorch; the upstream version range is the same on both variants.
    - pytorch >=2.4.0,<2.15.0               # [gpu_variant != "cuda"] analint: cbc_dep_in_run_missing_from_host  # runtime-only, nothing links torch at build
    - pytorch >=2.4.0,<2.15.0 *cuda*        # [gpu_variant == "cuda"] analint: cbc_dep_in_run_missing_from_host  # runtime-only, nothing links torch at build
    - torchvision
    - numpy
    - tqdm
    - psutil
    - tyro
    - protobuf
    - xformers >=0.0.27.post2
    # *cuda* on the CUDA variant for the same reason as pytorch: bitsandbytes ships CPU
    # builds at a higher build number than its cuda build, so an unconstrained solve
    # silently picks the CPU one and unsloth's 4-bit/QLoRA paths lose their kernels.
    - bitsandbytes >=0.45.5,!=0.46.0,!=0.48.0            # [gpu_variant != "cuda"]
    - bitsandbytes >=0.45.5,!=0.46.0,!=0.48.0 *cuda*     # [gpu_variant == "cuda"]
    - triton >=3.0.0
    - sentencepiece >=0.2.0
    - datasets >=3.4.1,!=4.0.*,!=4.1.0,!=4.4.*,!=4.5.0,<5.0.0
    - accelerate >=0.34.1
    - peft >=0.18.0,!=0.11.0
    - hf-transfer
    - diffusers >=0.39.0
    - transformers >=4.52.4,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,!=4.57.0,!=4.57.4,!=4.57.5,!=5.0.0,!=5.1.0,<=5.17.0
    - trl >=0.18.2,!=0.19.0,<=1.15.0
  run_constrained:
    # Bounded feature extras `eval` / `flashattention`. Not translated: `studio` is a lockfile
    # of == pins for the desktop app (would block co-installing other versions); cu*/colab*/
    # audio-torch*/amd bound torch/xformers/torchcodec/bitsandbytes differently per extra.
    # sentence-transformers (unbounded, lazily imported) would be a no-op and is omitted.
    - lm_eval >=0.4.4
    - flash-attn >=2.6.3

test:
  # Importing unsloth needs a real accelerator (unsloth_zoo.get_device_type() raises
  # NotImplementedError otherwise). The CUDA variants route their test task to a GPU
  # worker, so there the import is exercised for real; the CPU variant's worker has no
  # __cuda and can only run pip check and the CLI.
  imports:
    - unsloth  # [gpu_variant == "cuda"]
  commands:
    - pip check
    - unsloth --help
  requires:
    - pip

about:
  home: https://github.com/unslothai/unsloth
  # The library core is Apache-2.0 (LICENSE); unsloth_cli/, studio/ and unsloth/kernels/moe
  # are AGPL-3.0-only (COPYING, SPDX headers). Vendored: Cloudflare clef model (Apache-2.0),
  # truststore (MIT) and laya (Apache-2.0) under studio/backend/vendor.
  license: Apache-2.0 AND AGPL-3.0-only AND MIT
  license_family: Other
  license_file:
    - LICENSE
    - COPYING
    - unsloth/_vendor/clef/LICENSE
    - studio/backend/vendor/LICENSE
    - studio/backend/vendor/LICENSE.laya
  summary: 2-5X faster training, reinforcement learning & finetuning
  description: |
    Unsloth makes finetuning of large language models like Llama, Mistral, Gemma
    and Qwen 2-5x faster while using up to 80% less memory, with no accuracy
    degradation, via custom Triton kernels, manual autograd, and optimized
    attention / RoPE / cross-entropy implementations.
  # docs.unsloth.ai 301-redirects here; use the direct URL so the linter reachable_url check passes
  doc_url: https://unsloth.ai/docs
  dev_url: https://github.com/unslothai/unsloth

extra:
  skip-lints:
    # The CPU variant has no imports: block -- importing unsloth needs an accelerator,
    # which its CPU worker does not have. The CUDA variants do run the import test.
    - missing_imports_or_run_test_py
  recipe-maintainers:
    - isuruf
    - timkpaine
