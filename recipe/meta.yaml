{% set name = "unsloth" %}
{% set version = "2026.6.8" %}
{% set build_number = 0 %}
{% set cuda_enabled = (gpu_variant or "none") == "cuda" %}
{% set build = build_number + 100 if cuda_enabled else build_number %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/unsloth-{{ version }}.tar.gz
  sha256: 3d944b58d566ee8f6cd07841aa66d52d6046aab091ca546ecdfd24c7efc4a051

build:
  # CUDA variants are offset by +100 (see the `build` set above) so conda prefers
  # them wherever __cuda is present, while the CPU build stays installable on a
  # GPU-less machine -- the same arrangement pytorch itself ships (cpu_mkl /
  # cpu_openblas alongside gpu_cuda128 / gpu_cuda130).
  number: {{ build }}
  # linux-64 only: triton / xformers / unsloth_zoo (hard runtime deps) are linux-64-only on
  # pkgs/main. py 3.10-3.13: unsloth_zoo / cut_cross_entropy require python >=3.10; the
  # in-range datasets (upstream caps <4.4.0 -> 4.3.0) has no py3.14 build on pkgs/main
  # (its multiprocess 0.70.15 / fsspec 2025.7.0 deps stop at py3.13), so the whole
  # torch-2.10 stack caps at py3.13.
  skip: true  # [not linux64 or py<310 or py>313]
  # The cpu_ / cuda_ prefix MUST be in the build string: without it the two variants
  # deduplicate into a single package. py{{ CONDA_PY }} must stay too -- a manual
  # string overrides conda-build's default py-prefix, and the package is
  # python-version-specific (.pyc bytecode tagged cpXY). No CUDA version in the cuda
  # string: nothing is compiled against a toolkit, so the build is not specific to one
  # (see recipe/conda_build_config.yaml).
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}    # [gpu_variant != "cuda"]
  string: cuda_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}   # [gpu_variant == "cuda"]
  # Nothing is compiled, so the C/C++ compilers below contribute no linkage; without
  # this their run_exports (libgcc-ng / libstdcxx-ng) would land on the CUDA variant
  # only, making its run deps differ from the CPU variant's for no reason.
  ignore_run_exports_from:                  # [gpu_variant == "cuda"]
    - {{ compiler('c') }}                   # [gpu_variant == "cuda"]
    - {{ compiler('cxx') }}                 # [gpu_variant == "cuda"]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    # Nothing is compiled here -- unsloth is pure Python. cuda-nvcc is present because
    # pulling it into the build env is what routes the PBP build and test tasks to the
    # GPU worker pool; that is what makes the `__cuda` run dep resolvable and lets the
    # import test below actually execute on the CUDA variant.
    # compiler('c') and compiler('cxx') are required alongside it: cuda-nvcc's
    # activation script hard-fails without them --
    #   "cuda-nvcc: Please add the `compiler("c")` and `compiler("cxx")` packages
    #    to the environment."
    - {{ compiler('c') }}                   # [gpu_variant == "cuda"]
    - {{ compiler('cxx') }}                 # [gpu_variant == "cuda"]
    - {{ compiler('cuda') }}                # [gpu_variant == "cuda"]
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
    - wheel
    # No cuda-version / cuda-cudart-dev here on purpose. Nothing links against cudart
    # (pure Python), so there is no toolkit to pin; cuda-version also carries no
    # run_exports (its `constraints` are empty), so listing it in host would not
    # constrain run either way. Which CUDA line gets installed is decided by pytorch /
    # xformers / triton / bitsandbytes, each of which pins cuda-version itself. Same
    # reasoning as catboost's win cuda variant.
  run:
    - python
    - __cuda                                # [gpu_variant == "cuda"]
    # direct
    - typer
    - pydantic
    - pyyaml
    - nest-asyncio
    # torch / xformers -- upstream pins torch>=2.4.0,<2.11.0; the torch-2.10 stack
    # (xformers 0.0.34 + torchao via unsloth_zoo) resolves this to pytorch 2.10.0.
    # The upstream version range is untouched on both variants; the *cuda* build glob
    # only stops the CUDA build pairing with a cpu_mkl / cpu_openblas pytorch.
    - pytorch >=2.4.0,<2.11.0               # [gpu_variant != "cuda"]
    - pytorch >=2.4.0,<2.11.0 *cuda*        # [gpu_variant == "cuda"]
    - xformers >=0.0.27.post2
    # *cuda* on the CUDA variant for the same reason as pytorch: bitsandbytes ships CPU
    # builds at a higher build number than its cuda128 build, so an unconstrained solve
    # silently picks the CPU one and unsloth's 4-bit/QLoRA paths lose their kernels.
    # Version range is upstream on both.
    - bitsandbytes >=0.45.5,!=0.46.0,!=0.48.0            # [gpu_variant != "cuda"]
    - bitsandbytes >=0.45.5,!=0.46.0,!=0.48.0 *cuda*     # [gpu_variant == "cuda"]
    # triton
    - triton >=3.0.0
    # huggingface
    - wheel >=0.42.0
    - packaging
    - numpy
    - tqdm
    - psutil
    - tyro
    - protobuf
    - sentencepiece >=0.2.0
    - datasets >=3.4.1,!=4.0.*,!=4.1.0,<4.4.0
    - accelerate >=0.34.1
    - peft >=0.18.0,!=0.11.0
    - huggingface_hub >=0.34.0
    - hf-transfer
    - diffusers
    - transformers >=4.51.3,!=4.52.0,!=4.52.1,!=4.52.2,!=4.52.3,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,!=4.57.0,!=4.57.4,!=4.57.5,!=5.0.0,!=5.1.0,<=5.5.0
    - trl >=0.18.2,!=0.19.0,<=0.24.0
    - sentence-transformers
    - unsloth_zoo >=2026.6.6
    - torchvision

test:
  # Importing unsloth needs a real accelerator (unsloth_zoo.get_device_type() raises
  # NotImplementedError otherwise). The CUDA variants route their test task to a GPU
  # worker, so there the import is exercised for real; the CPU variant's worker has no
  # __cuda and can only run pip check.
  imports:
    - unsloth  # [gpu_variant == "cuda"]
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/unslothai/unsloth
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: 2-5X faster LLM finetuning
  description: |
    Unsloth makes finetuning of large language models like Llama, Mistral, Gemma
    and Qwen 2-5x faster while using up to 80% less memory, with no accuracy
    degradation, via custom Triton kernels, manual autograd, and optimized
    attention / RoPE / cross-entropy implementations.
  # docs.unsloth.ai 301-redirects here; use the direct URL so the linter reachable_url check passes
  doc_url: https://unsloth.ai/docs
  dev_url: https://github.com/unslothai/unsloth

extra:
  skip-lints:
    # pytorch/triton/xformers are CBC-pinned runtime-only deps (pure-Python; not linked at build)
    - cbc_dep_in_run_missing_from_host
    # The CPU variant has no imports: block -- importing unsloth needs an accelerator,
    # which its CPU worker does not have. The CUDA variants do run the import test.
    - missing_imports_or_run_test_py
  recipe-maintainers:
    - isuruf
    - timkpaine
