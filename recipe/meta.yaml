{% set name = "unsloth" %}
{% set version = "2026.6.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/unsloth-{{ version }}.tar.gz
  sha256: 3d944b58d566ee8f6cd07841aa66d52d6046aab091ca546ecdfd24c7efc4a051

build:
  number: 0
  # linux-64 only: triton / xformers / unsloth_zoo (hard runtime deps) are linux-64-only on
  # pkgs/main. py 3.10-3.13: unsloth_zoo / cut_cross_entropy require python >=3.10; the
  # in-range datasets (upstream caps <4.4.0 -> 4.3.0) has no py3.14 build on pkgs/main
  # (its multiprocess 0.70.15 / fsspec 2025.7.0 deps stop at py3.13), so the whole
  # torch-2.10 stack caps at py3.13.
  # GPU-only, so the `none` CUDA variant is dropped and only cuda128/cuda130 ship
  # (mirrors flash-attn). See recipe/conda_build_config.yaml for why 12.8/13.0.
  skip: true  # [not linux64 or py<310 or py>313 or cuda_compiler_version == "none"]
  # cuda{{ ... }} MUST be in the build string: without it the two CUDA variants
  # deduplicate into a single package. py{{ CONDA_PY }} must stay too -- a manual
  # string overrides conda-build's default py-prefix, and the package is
  # python-version-specific (.pyc bytecode tagged cpXY).
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    # Nothing is compiled here -- unsloth is pure Python. cuda-nvcc is present because
    # pulling it into the build env is what routes the PBP build and test tasks to the
    # GPU worker pool; that is what makes the `__cuda` run dep resolvable and lets the
    # import test below actually execute.
    - {{ compiler('cuda') }}
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
    - wheel
    # Supplies the `cuda-version >=12.8,<13` (resp. >=13.0,<14) run_export that keeps
    # pytorch / xformers / triton / bitsandbytes on one CUDA line at install time.
    - cuda-version {{ cuda_compiler_version }}
  run:
    - python
    # unsloth requires an NVIDIA GPU at runtime; pytorch and xformers already declare
    # __cuda on their CUDA builds and this makes the same requirement explicit here.
    - __cuda
    # direct
    - typer
    - pydantic
    - pyyaml
    - nest-asyncio
    # torch / xformers -- upstream pins torch>=2.4.0,<2.11.0; the torch-2.10 stack
    # (xformers 0.0.34 + torchao via unsloth_zoo) resolves this to pytorch 2.10.0.
    # The upstream version range is untouched; the *cuda* build glob only excludes the
    # cpu_mkl / cpu_openblas builds, which cannot serve a GPU-only package.
    - pytorch >=2.4.0,<2.11.0 *cuda*
    - xformers >=0.0.27.post2
    # *cuda* for the same reason as pytorch: bitsandbytes ships CPU builds at a higher
    # build number than its cuda128 build, so an unconstrained solve silently picks the
    # CPU one and unsloth's 4-bit/QLoRA paths lose their kernels. Version range is upstream.
    - bitsandbytes >=0.45.5,!=0.46.0,!=0.48.0 *cuda*
    # triton
    - triton >=3.0.0
    # huggingface
    - wheel >=0.42.0
    - packaging
    - numpy
    - tqdm
    - psutil
    - tyro
    - protobuf
    - sentencepiece >=0.2.0
    - datasets >=3.4.1,!=4.0.*,!=4.1.0,<4.4.0
    - accelerate >=0.34.1
    - peft >=0.18.0,!=0.11.0
    - huggingface_hub >=0.34.0
    - hf-transfer
    - diffusers
    - transformers >=4.51.3,!=4.52.0,!=4.52.1,!=4.52.2,!=4.52.3,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,!=4.57.0,!=4.57.4,!=4.57.5,!=5.0.0,!=5.1.0,<=5.5.0
    - trl >=0.18.2,!=0.19.0,<=0.24.0
    - sentence-transformers
    - unsloth_zoo >=2026.6.6
    - torchvision

test:
  # Importing unsloth needs a real accelerator (unsloth_zoo.get_device_type() raises
  # NotImplementedError otherwise). The CUDA-only build routes the test task to a GPU
  # worker, so the import can be exercised for real rather than skipped.
  imports:
    - unsloth
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/unslothai/unsloth
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: 2-5X faster LLM finetuning
  description: |
    Unsloth makes finetuning of large language models like Llama, Mistral, Gemma
    and Qwen 2-5x faster while using up to 80% less memory, with no accuracy
    degradation, via custom Triton kernels, manual autograd, and optimized
    attention / RoPE / cross-entropy implementations.
  # docs.unsloth.ai 301-redirects here; use the direct URL so the linter reachable_url check passes
  doc_url: https://unsloth.ai/docs
  dev_url: https://github.com/unslothai/unsloth

extra:
  skip-lints:
    # pytorch/triton/xformers are CBC-pinned runtime-only deps (pure-Python; not linked at build)
    - cbc_dep_in_run_missing_from_host
  recipe-maintainers:
    - isuruf
    - timkpaine
